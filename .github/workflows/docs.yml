name: docs

on:
  # Deploy on a stable release, so the site documents the latest release rather
  # than unreleased work on main. Pre-releases build but do not deploy.
  release:
    types: [published]
  # Deploy by hand, e.g. for a docs fix between releases.
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: extractions/setup-just@v4
      - uses: ts-graphviz/setup-graphviz@v2
      - run: uv sync --group docs --locked
      - run: uv run just export-all
      - run: uv run just docs
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease)
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease)
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub pages
        uses: actions/deploy-pages@v4
        id: deployment

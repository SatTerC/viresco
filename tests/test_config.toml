[pmodel]
method_kphio = "sandoval"
method_optchi = "lavergne20_c3"

[rothc]
n_years_spinup = 1

# Daily variables are consumed under bare names too, so both opt out of
# catena's default `_<label>` node-name suffix.
[inputs.daily]
path = "daily.nc"
suffix = ""
vars = [
  "precipitation",
  "sunshine_fraction",
  "temperature",
  "lai_obs",
  "gpp_obs",
  "co2",
  "fapar",
  "ppfd",
  "pressure",
  "vpd",
]

# Nothing in the pipeline consumes a weekly input any more. This one keeps the
# synthetic-data generator's weekly path covered.
[inputs.weekly]
path = "weekly.nc"
vars = [
  "dummy_variable",
]

[inputs.monthly]
path = "monthly.nc"
vars = [
  "dummy_variable",
]

[inputs.static]
path = "static.nc"
suffix = ""
vars = [
  "elevation",
  "plant_type",
  "max_soil_moisture",
  "clay_content",
  "soil_depth",
  "organic_carbon_stocks",
  "root_pool_init",
  "leaf_pool_init",
  "stem_pool_init",
]

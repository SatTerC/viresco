# A complete four-model Viresco pipeline: SPLASH water balance -> P-model
# photosynthesis -> SGAM vegetation growth -> RothC soil carbon.
#
# The framework is catena; every section below is catena's. viresco registers
# its four model modules with catena, so `[sgam]` and friends need no
# `_import_path`. See the catena configuration reference for the full schema:
# https://github.com/NERC-CEH/catena/blob/develop/docs/reference/configuration.md
#
# This file is a user-facing reference. Nothing in viresco loads it.

# SGAM's disturbance detection runs on daily observations; its weekly maximum is
# what SGAM consumes. See the `disturbances` [[resample]] entry below.
[sgam]
growing_season_limit = 10.0

[splash]
soil_moisture_init_method = "equilibrate"
soil_moisture_init_max_iter = 10
soil_moisture_init_max_diff = 1.0

[pmodel]
method_optchi = "prentice14"
method_jmaxlim = "wang17"
method_kphio = "temperature"
method_arrhenius = "simple"

[rothc]
# RothC's inert organic matter, from organic_carbon_stocks by the Falloon et al.
# (1998) equation rather than read from a file.
inert_organic_matter_from = "falloon"
rothc_spinup_years = 1
dpm_rate = 10.0
rpm_rate = 0.3
bio_rate = 0.66
hum_rate = 0.02
# RothC's own evaporation driver is open-pan, which it multiplies by evap_factor
# to get evapotranspiration. We supply potential evapotranspiration directly (see
# the monthly-total [[resample]] below), so there is nothing to
# convert: 1.0 passes it through unscaled.
evap_factor = 1.0
equilibrium_threshold = 1e-06
zero_threshold = 1e-08

# Node names are `{var}{suffix}`, and the suffix defaults to `_<section label>`.
# viresco's convention is that daily nodes are bare (`temperature`) and coarser
# ones are suffixed (`temperature_weekly`), so this section sets `suffix = ""`.
# The labels themselves are inert: catena infers no frequency from them. The
# models declare their expected frequencies as `Freq` contracts instead (see
# viresco.temporal), so a weekly file wired into a daily parameter is caught
# before anything runs.
[inputs.daily]
path = "inputs/daily.nc"
suffix = ""
vars = [
    "co2",
    "fapar",
    "gpp_obs",
    "lai_obs",
    "ppfd",
    "precipitation",
    "pressure",
    "sunshine_fraction",
    "temperature",
    "vpd",
]

# Static variables are bare too (`elevation`, not `elevation_static`). A bare
# name is therefore daily or static, and only a node's declared `Freq` says which.
# `latitude` is an ordinary input. Synthetic data writes it as a variable; a
# file that carries it as a coordinate binds it with the mapping form of `vars`
# instead: `{ latitude = "y" }` on a latitude-longitude grid, or `{ latitude =
# "lat" }` for the 2-D coordinate a CF file on a projected grid carries.
[inputs.static]
path = "inputs/static.nc"
suffix = ""
vars = [
    "clay_content",
    "elevation",
    "latitude",
    "leaf_pool_init",
    "max_soil_moisture",
    "organic_carbon_stocks",
    "plant_type",
    "root_pool_init",
    "soil_depth",
    "stem_pool_init",
]

# catena does not check that gridded inputs share a grid unless asked, and
# without these checks xarray's default inner join silently drops the cells that
# do not line up. Name the gridded sections only: `crs_equal` fails a file with no
# CRS, such as a table of sites.
[validation]
checks = [
    { check = "crs_equal", inputs = ["daily", "static"] },
    { check = "coords_equal", inputs = ["daily", "static"], coords = ["y", "x"] },
]

# The models know nothing of each other, and connect only where a name and its
# units line up. Where they do not, a coupling in `viresco.couplings` makes one
# model's output into another's input; each is selected by a key named for the
# node it produces, and none is on unless its key is set. The docstrings in
# viresco/couplings.py say why each conversion is what it is.
#
# - gpp, lue: pyrealm reports GPP as a flux in ug C m-2 s-1 and LUE per mole of
#   photons; SGAM wants g C m-2 d-1 and g C per MJ of PAR. The couplings act on
#   the daily values, and the [[resample]] below takes SGAM's weekly means.
# - volumetric_water_content: SPLASH's bucket depth over its capacity, times a
#   representative porosity, `bucket_porosity`.
# - soil_carbon_input_monthly: SGAM's monthly litterfall, the increment of its
#   accumulated litter pool, for RothC.
# - aridity_index: PET over precipitation over the whole record, which only
#   pyrealm's `sandoval` quantum yield consumes. With the `method_kphio` above it
#   goes unused, and is here so that switching to sandoval needs no new key.
# iWUE needs no coupling: pyrealm and SGAM agree on umol mol-1.
[couplings]
gpp_from = "pmodel"
lue_from = "pmodel"
volumetric_water_content_from = "splash"
soil_carbon_input_monthly_from = "sgam"
aridity_index_from = "splash"
bucket_porosity = 0.45
par_photons_per_mj = 4.57

# `from` and `to` are node-name suffixes, nothing more; `freq` is what actually
# happens to the time axis, and becomes the generated node's declared frequency
# contract. `from = ""` reads the bare daily name.
# `units` declares each output's unit, as on a [[node]]: catena carries nothing
# across a resample, so an undeclared unit leaves the edge out of it unchecked
# until it runs. A resample keeps its input's label, so these are the daily units.
# The P-model's outputs and SGAM's other daily drivers, as weekly means. SGAM
# wants weekly mean LUE and iWUE, so a plain mean is the right aggregate.
[[resample]]
vars = [
    "temperature",
    "volumetric_water_content",
    "vpd",
    "gpp",
    "lue",
    "iwue",
]
from = ""
to = "weekly"
freq = "7D"
units = { temperature = "degC", volumetric_water_content = "m3 m-3", vpd = "Pa", gpp = "g m-2 d-1", lue = "g MJ-1", iwue = "umol mol-1" }

[[resample]]
vars = [
    "temperature",
]
from = ""
to = "monthly"
freq = "1ME"
units = "degC"

[[resample]]
vars = ["disturbances"]
from = ""
to = "weekly"
freq = "7D"
aggfunc = "max"
units = "1"

# PET, not AET: RothC's water balance is rainfall minus evaporative *demand*, and
# it derives its own moisture deficit from that. Feeding it AET -- the water the
# soil actually gave up, which is already suppressed by the very dryness RothC is
# trying to compute -- double-counts the limitation and holds the soil too wet.
#
# SPLASH PET and precipitation are daily rates (mm d-1); RothC wants monthly
# totals (mm). Summing a daily rate over the month integrates it (daily Δt = 1
# day, so Σ mm d-1 is numerically the monthly mm total). The sum keeps the
# rate's label, so `overwrite_units` replaces it with the total's. That relabel
# is a claim, not a check: it holds only because the input is daily.
[[resample]]
vars = ["potential_evapotranspiration", "precipitation"]
from = ""
to = "monthly"
freq = "1ME"
aggfunc = "sum"
units = "mm"
overwrite_units = true

[outputs.daily]
path = "outputs/daily.nc"
suffix = ""
vars = [
    "actual_evapotranspiration",
    "disturbances",
    "gpp_flux",
    "runoff",
    "soil_moisture",
]

[outputs.weekly]
path = "outputs/weekly.nc"
vars = [
    "allocation_leaf",
    "allocation_root",
    "allocation_stem",
    "cue",
    "disturbance_leaf",
    "disturbance_root",
    "disturbance_stem",
    "drought_modifier",
    "gpp",
    "iwue",
    "iwue_score",
    "leaf_area_index",
    "leaf_pool",
    "litter_pool",
    "lue",
    "lue_score",
    "npp_leaf",
    "npp_root",
    "npp_stem",
    "removed_pool",
    "respiration_leaf",
    "respiration_root",
    "respiration_stem",
    "root_pool",
    "stem_pool",
    "turnover_leaf",
    "turnover_root",
    "turnover_stem",
]

[outputs.monthly]
path = "outputs/monthly.nc"
vars = [
    "decomposable_plant_material",
    "dpm_rpm_ratio",
    "farmyard_manure_input",
    "heterotrophic_respiration",
    "humified_organic_matter",
    "microbial_biomass",
    "plant_cover",
    "resistant_plant_material",
    "soil_organic_carbon",
]

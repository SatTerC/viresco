# SPLASH driven by a COSMOS-UK site's own meteorology, alongside its soil moisture.

[inputs.cosmos]
path = "data/cosmos.nc"
suffix = ""
vars = ["cosmos_vwc", "precip", "snow", "swin", "ta"]

# latitude and elevation are per-site coordinates of the file, not variables.
[inputs.site]
path = "data/cosmos.nc"
vars = { latitude = "lat", elevation = "altitude" }

[soil_moisture_nodes]
_import_path = "nodes.py"
initial_max_soil_moisture = 150.0

# Registered by xharvest, so it needs no _import_path.
[cosmos]

[splash]
sunshine_fraction_method = "shortwave"
soil_moisture_init_max_iter = 50

[outputs.soil_moisture]
path = "results/soil_moisture.nc"
suffix = ""
vars = ["soil_moisture_daily", "cosmos_vwc_snow_masked", "sunshine_fraction_daily"]

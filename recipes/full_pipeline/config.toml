# SPLASH, the P-model, SGAM and RothC in one pipeline, joined by couplings.

[splash]

[pmodel]
method_kphio = "sandoval"
method_optchi = "lavergne20_c3"

[sgam]

[rothc]
inert_organic_matter_from = "falloon"
rothc_spinup_years = 1
equilibrium_threshold = 0.0001

# The couplings between the models, from viresco.couplings: each key names the
# node it produces and the model it takes from.
[couplings]
gpp_from = "pmodel"
lue_from = "pmodel"
volumetric_water_content_from = "splash"
aridity_index_from = "splash"
bucket_porosity = 0.45
par_photons_per_mj = 4.57
soil_carbon_input_monthly_from = "sgam"

[inputs.daily]
path = "data/daily.nc"
suffix = ""
vars = [
  "precipitation",
  "sunshine_fraction",
  "temperature",
  "lai_obs",
  "gpp_obs",
  "co2",
  "fapar",
  "ppfd",
  "pressure",
  "vpd",
]

[inputs.static]
path = "data/static.nc"
suffix = ""
vars = [
  "elevation",
  "latitude",
  "plant_type",
  "max_soil_moisture",
  "clay_content",
  "soil_depth",
  "organic_carbon_stocks",
  "root_pool_init",
  "leaf_pool_init",
  "stem_pool_init",
]

# The two files must be on one grid; catena checks this only when asked.
[validation]
checks = [
  { check = "crs_equal", inputs = ["daily", "static"] },
  { check = "coords_equal", inputs = ["daily", "static"], coords = ["y", "x"] },
]

# SGAM's weekly drivers, as means of the daily SPLASH and P-model values.
[[resample]]
vars = [
  "temperature",
  "volumetric_water_content",
  "vpd",
  "gpp",
  "lue",
  "iwue",
]
from = ""
to = "weekly"
freq = "7D"
units = { temperature = "degC", volumetric_water_content = "m3 m-3", vpd = "Pa", gpp = "g m-2 d-1", lue = "g MJ-1", iwue = "umol mol-1" }

[[resample]]
vars = [
  "temperature",
]
from = ""
to = "monthly"
freq = "1ME"
units = "degC"

[[resample]]
vars = ["disturbances"]
from = ""
to = "weekly"
freq = "7D"
aggfunc = "max"
units = "1"

# RothC's monthly water balance: totals of SPLASH's daily rates. PET, not AET:
# RothC's water balance is rainfall minus evaporative demand, and AET is already
# suppressed by the dryness RothC is trying to compute, so it would double-count
# the limitation and hold the soil too wet.
# Summing a daily rate in mm d-1 over a month gives the total in mm, because the
# daily timestep is one day. The sum keeps the rate's label, so `overwrite_units`
# replaces it: a stated claim, which holds only because the input is daily.
[[resample]]
vars = ["potential_evapotranspiration", "precipitation"]
from = ""
to = "monthly"
freq = "1ME"
aggfunc = "sum"
units = "mm"
overwrite_units = true

[outputs.daily]
path = "results/daily.nc"
suffix = ""
vars = [
  "actual_evapotranspiration",
  "soil_moisture",
  "runoff",
]

[outputs.weekly]
path = "results/weekly.nc"
vars = [
  "gpp",
  "leaf_pool",
  "stem_pool",
  "root_pool",
  "litter_pool",
  "leaf_area_index",
]

[outputs.monthly]
path = "results/monthly.nc"
vars = [
  "decomposable_plant_material",
  "resistant_plant_material",
  "microbial_biomass",
  "humified_organic_matter",
  "soil_organic_carbon",
  "heterotrophic_respiration",
]

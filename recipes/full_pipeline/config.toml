# SPLASH, the P-model, SGAM and RothC in one pipeline, joined by the bridges in
# nodes.py.

[splash]

[pmodel]
method_kphio = "sandoval"
method_optchi = "lavergne20_c3"

[sgam]

[rothc]
n_years_spinup = 1
equilibrium_threshold = 0.0001

[bridges]
_import_path = "nodes.py"
porosity = 0.45
par_photons_per_mj = 4.57

[inputs.daily]
path = "data/daily.nc"
suffix = ""
vars = [
  "precipitation",
  "sunshine_fraction",
  "temperature",
  "lai_obs",
  "gpp_obs",
  "co2",
  "fapar",
  "ppfd",
  "pressure",
  "vpd",
]

[inputs.static]
path = "data/static.nc"
suffix = ""
vars = [
  "elevation",
  "plant_type",
  "max_soil_moisture",
  "clay_content",
  "soil_depth",
  "organic_carbon_stocks",
  "root_pool_init",
  "leaf_pool_init",
  "stem_pool_init",
]

# SGAM's weekly drivers, as means of the daily SPLASH and P-model values.
[[resample]]
vars = [
  "temperature",
  "volumetric_water_content",
  "vpd",
  "gpp_flux",
  "lue_photon",
  "iwue",
]
from = ""
to = "weekly"
freq = "7D"
units = { temperature = "degC", volumetric_water_content = "m3 m-3", vpd = "Pa", gpp_flux = "ug m-2 s-1", lue_photon = "g mol-1", iwue = "umol mol-1" }

[[resample]]
vars = [
  "temperature",
]
from = ""
to = "monthly"
freq = "1ME"
units = "degC"

[[resample]]
vars = ["disturbances"]
from = ""
to = "weekly"
freq = "7D"
aggfunc = "max"
units = "1"

# RothC's monthly water balance: totals of SPLASH's daily rates. PET, not AET:
# RothC's water balance is rainfall minus evaporative demand, and AET is already
# suppressed by the dryness RothC is trying to compute, so it would double-count
# the limitation and hold the soil too wet.
# Summing a daily rate in mm d-1 over a month gives the total in mm, because the
# daily timestep is one day. The sum keeps the rate's label, so `overwrite_units`
# replaces it: a stated claim, which holds only because the input is daily.
[[resample]]
vars = ["potential_evapotranspiration", "precipitation"]
from = ""
to = "monthly"
freq = "1ME"
aggfunc = "sum"
units = "mm"
overwrite_units = true

[outputs.daily]
path = "results/daily.nc"
suffix = ""
vars = [
  "actual_evapotranspiration",
  "soil_moisture",
  "runoff",
]

[outputs.weekly]
path = "results/weekly.nc"
vars = [
  "gpp",
  "leaf_pool",
  "stem_pool",
  "root_pool",
  "litter_pool",
  "leaf_area_index",
]

[outputs.monthly]
path = "results/monthly.nc"
vars = [
  "decomposable_plant_material",
  "resistant_plant_material",
  "microbial_biomass",
  "humified_organic_matter",
  "soil_organic_carbon",
  "heterotrophic_respiration",
]

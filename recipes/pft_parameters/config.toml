# SPLASH, the P-model and SGAM, joined by couplings.

[splash]

[pmodel]
method_kphio = "sandoval"
method_optchi = "lavergne20_c3"

[sgam]

# The couplings between the models, from viresco.couplings: each key names the
# node it produces and the model it takes from.
[couplings]
gpp_from = "pmodel"
lue_from = "pmodel"
volumetric_water_content_from = "splash"
aridity_index_from = "splash"
bucket_porosity = 0.45
par_photons_per_mj = 4.57

[inputs.daily]
path = "data/daily.nc"
suffix = ""
vars = [
  "precipitation",
  "sunshine_fraction",
  "temperature",
  "lai_obs",
  "gpp_obs",
  "co2",
  "fapar",
  "ppfd",
  "pressure",
  "vpd",
]

[inputs.static]
path = "data/static.nc"
suffix = ""
vars = [
  "elevation",
  "latitude",
  "plant_type",
  "max_soil_moisture",
  "leaf_pool_init",
  "stem_pool_init",
  "root_pool_init",
]

# The two files must be on one grid; catena checks this only when asked.
[validation]
checks = [
  { check = "crs_equal", inputs = ["daily", "static"] },
  { check = "coords_equal", inputs = ["daily", "static"], coords = ["y", "x"] },
]

# SGAM's weekly drivers, as means of the daily SPLASH and P-model values.
[[resample]]
vars = [
  "temperature",
  "volumetric_water_content",
  "vpd",
  "gpp",
  "lue",
  "iwue",
]
from = ""
to = "weekly"
freq = "7D"
units = { temperature = "degC", volumetric_water_content = "m3 m-3", vpd = "Pa", gpp = "g m-2 d-1", lue = "g MJ-1", iwue = "umol mol-1" }

[[resample]]
vars = ["disturbances"]
from = ""
to = "weekly"
freq = "7D"
aggfunc = "max"
units = "1"

[outputs.weekly]
path = "results/weekly.nc"
vars = [
  "gpp",
  "leaf_pool",
  "stem_pool",
  "root_pool",
]
